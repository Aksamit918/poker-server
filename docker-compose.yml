services:
  db:
    image: postgres:17-alpine
    container_name: poker_db_container
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: poker_redis
    restart: always

  app:
    build: .
    container_name: poker_server_container
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health/core"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - SPRING_PROFILES_ACTIVE=prod
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - POKER_AVATARS_DIR=${POKER_AVATARS_DIR}
      - POKER_PUBLIC_URL=${POKER_PUBLIC_URL}
    volumes:
      - ./avatars:${POKER_AVATARS_DIR:-/app/avatars}

  frontend:
    build: ../frontend
    container_name: poker_frontend_container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    environment:
      - JAVA_HOST=app:8080
      - FRONTEND_JAVA_HOST=polupoker.by
      - SESSION_KEY=poker_super_secret_session_key_12345

  nginx:
    image: nginx:alpine
    container_name: poker_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/poker/backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - /root/poker/backend/ssl:/etc/nginx/ssl:ro
      - ./avatars:/usr/share/nginx/avatars:ro
      - /root/poker/frontend/static:/usr/share/nginx/static:ro
    depends_on:
      - app
      - frontend

volumes:
  db_data: